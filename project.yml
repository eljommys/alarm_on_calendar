name: AlarmOnCalendar
options:
  bundleIdPrefix: com.rackslabs
  developmentLanguage: es
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.1"
    DEVELOPMENT_TEAM: "25G3Q8388L"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  AlarmOnCalendar:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: AlarmOnCalendarWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rackslabs.alarmoncalendar
        PRODUCT_NAME: AlarmOnCalendar
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  AlarmOnCalendarWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rackslabs.alarmoncalendar.widget
        PRODUCT_NAME: AlarmOnCalendarWidget
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Widget/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  AlarmOnCalendarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared
      # Solo depende de Foundation/Observation, así que se puede probar sin la app.
      - path: App/Settings/SettingsStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rackslabs.alarmoncalendar.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AlarmOnCalendar:
    build:
      targets:
        AlarmOnCalendar: all
        AlarmOnCalendarWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AlarmOnCalendarTests
